  start_date: "2026-01-01"
  timezone: UTC
  scenario: mixed

process:
  dt_days: 1.0
  follicular_days: 14.0
  luteal_days: 14.0
  kappa_log_speed_f: 0.35
  kappa_log_speed_l: 0.45
  sigma_log_speed_f: 0.035
  sigma_log_speed_l: 0.025
  sigma_progress_f: 0.006
  sigma_progress_l: 0.004
