source_dataset: salzburg-salivary-hormones-osf-qevzh
seed: 20260724
split:
  train_fraction: 0.60
  calibration_fraction: 0.20
  stratify_by: has_lh_reference
tasks:
  next_menses:
    issue_day: 7
    minimum_history_cycles: 1
    rolling_window: 3
  lh_transition:
    issue_day: 7
    rolling_window: 3
evaluation:
