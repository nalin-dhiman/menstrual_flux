  forecast_samples: 1200
  bootstrap_replicates: 5000
feature_model:
  signals: [salivary_estradiol, salivary_progesterone, bleeding_reported]
  ridge_penalty: 10.0
digital_twin:
  base_config: configs/experiments/milestone_1.yaml
  particles: 500
  forecast_samples: 1200
  forecast_horizon_days: 60
  modalities:
    all: [estradiol, progesterone, bleeding]
    hormones: [estradiol, progesterone]
    bleeding: [bleeding]
